const TOPICS = ["All Topics", ...new Set(ALL_QUESTIONS.map(q => q.topic))];

let questions = [];
let current = 0;
let score = 0;
let answered = [];
let started = false;
let quizMode = "all";
let numQ = 50;

function shuffle(arr) {
  let a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz(topic, num) {
  let pool = topic === "All Topics" ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q => q.topic === topic);
  questions = shuffle(pool).slice(0, Math.min(num, pool.length));
  current = 0; score = 0;
  answered = new Array(questions.length).fill(null);
  started = true;
  render();
}

function selectAnswer(idx) {
  if (answered[current] !== null) return;
  answered[current] = idx;
  if (idx === questions[current].ans) score++;
  render();
}

function next() { if (current < questions.length - 1) { current++; render(); } }
function prev() { if (current > 0) { current--; render(); } }

function renderStart() {
  return `

      <p>Practice test based on BCSM 0001 past exam papers &nbsp;·&nbsp; ${ALL_QUESTIONS.length} questions available</p>
    </div>
    <div class="q-card">
      <p style="font-size:14px;color:var(--color-text-secondary);margin-bottom:12px;">Configure your test</p>
      <div class="filter-row">
        <label style="font-size:13px;color:var(--color-text-secondary);min-width:60px;">Topic</label>
        <select id="topicSel">${TOPICS.map(t => `<option>${t}</option>`).join("")}</select>
      </div>
      <div class="filter-row" style="margin-top:8px;">
        <label style="font-size:13px;color:var(--color-text-secondary);min-width:60px;">Questions</label>
        <select id="numSel">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="75">75</option>
          <option value="93">All (${ALL_QUESTIONS.length})</option>
        </select>
      </div>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="document.getElementById('startBtn').click()">Start Practice Test ↗</button>
      <button id="startBtn" style="display:none" onclick="
        const t = document.getElementById('topicSel').value;
        const n = parseInt(document.getElementById('numSel').value);
        startQuiz(t, n);
      "></button>
    </div>
    <div style="margin-top:1rem;">
      <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:8px;">Topics covered:</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        ${[...new Set(ALL_QUESTIONS.map(q=>q.topic))].map(t=>`<span class="badge badge-blue">${t}</span>`).join("")}
      </div>
    </div>
  `;
}

function renderQuiz() {
  const q = questions[current];
  const ans = answered[current];
  const total = questions.length;
  const pct = Math.round((current / total) * 100);

  return `
    <div class="stats">
      <div class="stat"><div class="stat-val">${current + 1}/${total}</div><div class="stat-lbl">Question</div></div>
      <div class="stat"><div class="stat-val" style="color:#3B6D11">${score}</div><div class="stat-lbl">Correct</div></div>
      <div class="stat"><div class="stat-val" style="color:#A32D2D">${answered.filter((a,i)=>a!==null && a!==questions[i].ans).length}</div><div class="stat-lbl">Wrong</div></div>
      <div class="stat"><div class="stat-val">${answered.filter(a=>a===null).length}</div><div class="stat-lbl">Remaining</div></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-card">
      <div class="q-num">Q${current + 1} &nbsp;·&nbsp; <span class="badge badge-blue">${q.topic}</span></div>
      <div class="q-text">${q.q}</div>
      <div class="options">
        ${q.opts.map((o, i) => {
          let cls = "opt-btn";
          if (ans !== null) {
            if (i === q.ans) cls += " correct";
            else if (i === ans && ans !== q.ans) cls += " wrong";
          }
          return `<button class="${cls}" onclick="selectAnswer(${i})" ${ans !== null ? "disabled" : ""}>${String.fromCharCode(65+i)}. ${o}</button>`;
        }).join("")}
      </div>
      ${ans !== null ? `
        <div class="feedback show ${ans === q.ans ? "correct" : "wrong"}">
          ${ans === q.ans ? "✓ Correct!" : `✗ Wrong. Correct answer: <strong>${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]}</strong>`}
        </div>
      ` : ""}
    </div>
    <div class="nav">
      <button class="btn" onclick="prev()" ${current === 0 ? "disabled" : ""}>← Previous</button>
      ${current < total - 1 
        ? `<button class="btn btn-primary" onclick="next()">Next →</button>`
        : `<button class="btn btn-primary" onclick="showResult()">Finish Test ↗</button>`
      }
      <button class="btn" onclick="if(confirm('Restart quiz?')){started=false;render();}">↺ Restart</button>
    </div>
  `;
}

function showResult() {
  const total = questions.length;
  const pct = Math.round((score / total) * 100);
  const grade = pct >= 90 ? "Excellent!" : pct >= 75 ? "Good job!" : pct >= 60 ? "Keep practicing!" : "Need more revision";
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="result-screen">
      <h2>${grade}</h2>
      <div class="score-circle">
        <span class="score-pct">${pct}%</span>
        <span class="score-sub">${score}/${total}</span>
      </div>
      <p style="font-size:15px;color:var(--color-text-secondary);margin-bottom:1.5rem;">You answered ${score} out of ${total} questions correctly.</p>
      <div class="stats" style="max-width:360px;margin:0 auto 1.5rem;">
        <div class="stat"><div class="stat-val" style="color:#3B6D11">${score}</div><div class="stat-lbl">Correct</div></div>
        <div class="stat"><div class="stat-val" style="color:#A32D2D">${total - score}</div><div class="stat-lbl">Wrong</div></div>
        <div class="stat"><div class="stat-val">${pct}%</div><div class="stat-lbl">Score</div></div>
        <div class="stat"><div class="stat-val">${total}</div><div class="stat-lbl">Total</div></div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="started=false;render();">New Test ↗</button>
        <button class="btn" onclick="current=0;render();">Review Answers</button>
      </div>
    </div>
  `;
}

function render() {
  document.getElementById("app").innerHTML = started ? renderQuiz() : renderStart();
}

render();
</script>
