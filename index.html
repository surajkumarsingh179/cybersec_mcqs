<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberQuiz — Test Your Security Knowledge</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c14;
  --surface: #0d1424;
  --surface2: #111b30;
  --border: #1e2d4a;
  --border2: #253550;
  --accent: #00d4ff;
  --accent2: #0099cc;
  --green: #00e676;
  --red: #ff3d71;
  --yellow: #ffd740;
  --purple: #b388ff;
  --text: #e8f0fe;
  --muted: #6b7fa3;
  --dimmer: #3d5280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* animated grid bg */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  top: -200px; right: -200px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(0,212,255,0.06) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

#app {
  position: relative;
  z-index: 1;
  max-width: 860px;
  margin: 0 auto;
  padding: 30px 20px 60px;
}

/* HEADER */
.site-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 36px;
}
.logo-icon {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.site-title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
}
.site-title span { color: var(--accent); }
.site-sub {
  font-size: 13px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
}

/* CARDS */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.3), transparent);
}

/* SETUP SCREEN */
.setup-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}
@media (max-width: 600px) { .setup-grid { grid-template-columns: 1fr; } }

.field-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
input, select {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 10px;
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border 0.2s;
  appearance: none;
  -webkit-appearance: none;
}
input:focus, select:focus { border-color: var(--accent); }
input::placeholder { color: var(--muted); }

.topic-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}
.chip {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  background: var(--bg);
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: rgba(0,212,255,0.12); border-color: var(--accent); color: var(--accent); }

.q-count-options {
  display: flex;
  gap: 10px;
}
.count-opt {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--border2);
  background: var(--bg);
  color: var(--muted);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}
.count-opt:hover { border-color: var(--accent); color: var(--accent); }
.count-opt.active { background: rgba(0,212,255,0.12); border-color: var(--accent); color: var(--accent); }

/* BUTTONS */
.btn {
  padding: 13px 22px;
  border-radius: 10px;
  border: none;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
.btn-ghost:hover:not(:disabled) { background: var(--border2); }
.btn-primary {
  background: var(--accent);
  color: #000;
}
.btn-primary:hover:not(:disabled) {
  background: #33ddff;
  box-shadow: 0 0 20px rgba(0,212,255,0.4);
  transform: translateY(-1px);
}
.btn-start {
  width: 100%;
  padding: 16px;
  font-size: 16px;
  background: linear-gradient(135deg, var(--accent), #0073e6);
  color: #000;
  border-radius: 12px;
  border: none;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
}
.btn-start:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(0,212,255,0.35);
}

/* QUIZ SCREEN */
.hud {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.hud-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 10px;
  text-align: center;
}
.hud-val {
  font-size: 20px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
}
.hud-val.green { color: var(--green); }
.hud-val.red { color: var(--red); }
.hud-val.blue { color: var(--accent); }
.hud-lbl {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 3px;
}

/* progress */
.progress-wrap {
  background: var(--surface2);
  border-radius: 4px;
  height: 4px;
  margin-bottom: 20px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--purple));
  border-radius: 4px;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* question nav dots */
.q-dots {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 20px;
}
.q-dot {
  width: 28px; height: 28px;
  border-radius: 6px;
  border: 1px solid var(--border2);
  background: var(--bg);
  color: var(--muted);
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
}
.q-dot:hover { border-color: var(--accent); }
.q-dot.current { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.1); }
.q-dot.correct { background: rgba(0,230,118,0.15); border-color: var(--green); color: var(--green); }
.q-dot.wrong { background: rgba(255,61,113,0.15); border-color: var(--red); color: var(--red); }
.q-dot.skipped { background: rgba(255,215,64,0.1); border-color: var(--yellow); color: var(--yellow); }

/* question card */
.q-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.q-index {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--muted);
}
.topic-badge {
  padding: 3px 10px;
  border-radius: 20px;
  background: rgba(0,212,255,0.1);
  border: 1px solid rgba(0,212,255,0.25);
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
}
.q-text {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.55;
  margin-bottom: 20px;
  letter-spacing: -0.2px;
}

/* options */
.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid var(--border2);
  background: var(--bg);
  cursor: pointer;
  transition: all 0.18s;
  text-align: left;
  width: 100%;
}
.opt:hover:not(:disabled) {
  border-color: var(--accent);
  background: rgba(0,212,255,0.05);
}
.opt:disabled { cursor: default; }
.opt-letter {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
  transition: all 0.18s;
}
.opt-text { font-size: 14px; font-weight: 500; line-height: 1.4; }

.opt.correct {
  border-color: var(--green);
  background: rgba(0,230,118,0.08);
  animation: flash-green 0.4s ease;
}
.opt.correct .opt-letter { background: var(--green); color: #000; border-color: var(--green); }

.opt.wrong {
  border-color: var(--red);
  background: rgba(255,61,113,0.08);
  animation: flash-red 0.4s ease;
}
.opt.wrong .opt-letter { background: var(--red); color: #fff; border-color: var(--red); }

.opt.highlight-correct {
  border-color: var(--green);
  background: rgba(0,230,118,0.05);
}
.opt.highlight-correct .opt-letter { border-color: var(--green); color: var(--green); }

@keyframes flash-green {
  0% { box-shadow: 0 0 0 rgba(0,230,118,0); }
  50% { box-shadow: 0 0 20px rgba(0,230,118,0.3); }
  100% { box-shadow: 0 0 0 rgba(0,230,118,0); }
}
@keyframes flash-red {
  0% { box-shadow: 0 0 0 rgba(255,61,113,0); }
  50% { box-shadow: 0 0 20px rgba(255,61,113,0.25); }
  100% { box-shadow: 0 0 0 rgba(255,61,113,0); }
}

/* explanation */
.explanation {
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 10px;
  background: rgba(0,212,255,0.06);
  border-left: 3px solid var(--accent);
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
  display: none;
}
.explanation.show { display: block; animation: fade-in 0.3s; }
@keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* nav */
.nav-row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.nav-spacer { flex: 1; }

/* TIMER */
.timer {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  padding: 8px 14px;
  background: var(--surface2);
  border-radius: 8px;
  border: 1px solid var(--border2);
  color: var(--muted);
  transition: color 0.3s;
}
.timer.warn { color: var(--yellow); border-color: rgba(255,215,64,0.4); }
.timer.danger { color: var(--red); border-color: rgba(255,61,113,0.4); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }

/* RESULTS */
.result-hero {
  text-align: center;
  padding: 40px 20px;
}
.score-ring {
  width: 150px; height: 150px;
  margin: 0 auto 24px;
  position: relative;
}
.score-ring svg { transform: rotate(-90deg); }
.score-ring-val {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.score-pct {
  font-size: 36px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent);
}
.score-frac {
  font-size: 13px;
  color: var(--muted);
}
.grade-text {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 6px;
}
.grade-sub { color: var(--muted); font-size: 14px; }

.result-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin: 24px 0;
}
@media (max-width: 500px) { .result-stats { grid-template-columns: repeat(2,1fr); } }

.rstat {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 10px;
  text-align: center;
}
.rstat-val { font-size: 24px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.rstat-lbl { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

/* LEADERBOARD */
.lb-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.lb-title {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--muted);
}
.lb-cols {
  display: grid;
  grid-template-columns: 36px 1fr auto auto auto;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}
.lb-col-lbl {
  font-size: 11px;
  color: var(--dimmer);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
}
.lb-row {
  display: grid;
  grid-template-columns: 36px 1fr auto auto auto;
  gap: 8px;
  align-items: center;
  padding: 12px 6px;
  border-bottom: 1px solid var(--border);
  border-radius: 8px;
  transition: background 0.15s;
  animation: row-in 0.3s ease both;
}
.lb-row:hover { background: var(--surface2); }
@keyframes row-in { from { opacity:0; transform:translateX(-8px); } to { opacity:1; transform:translateX(0); } }
.lb-rank {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
}
.rank-1 { color: #ffd700; }
.rank-2 { color: #c0c0c0; }
.rank-3 { color: #cd7f32; }
.lb-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-score { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted); }
.lb-pct { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; }
.lb-pct.high { color: var(--green); }
.lb-pct.mid { color: var(--yellow); }
.lb-pct.low { color: var(--red); }
.lb-bar-wrap { min-width: 80px; }
.lb-bar-bg {
  height: 4px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.lb-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.8s ease;
}
.lb-you { border: 1px solid rgba(0,212,255,0.3) !important; background: rgba(0,212,255,0.04) !important; }

.you-badge {
  font-size: 10px;
  padding: 2px 6px;
  background: rgba(0,212,255,0.15);
  border: 1px solid var(--accent);
  border-radius: 4px;
  color: var(--accent);
  margin-left: 6px;
  font-weight: 600;
}

.topic-breakdown {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}
.tb-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.tb-name { font-size: 12px; width: 160px; flex-shrink: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-bar-bg { flex: 1; height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; }
.tb-bar-fill { height: 100%; border-radius: 4px; }
.tb-score { font-size: 12px; font-family: 'JetBrains Mono', monospace; min-width: 36px; text-align: right; }

.empty-state {
  text-align: center;
  padding: 30px;
  color: var(--muted);
  font-size: 14px;
}

/* section title */
.section-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--dimmer);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.tab-row {
  display: flex;
  gap: 0;
  background: var(--bg);
  border-radius: 10px;
  padding: 4px;
  border: 1px solid var(--border);
  margin-bottom: 20px;
}
.tab {
  flex: 1;
  padding: 9px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.tab.active {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border2);
}

.confetti { display: none; }
</style>
</head>

<div id="app"></div>

const TOPICS = ["All Topics", ...new Set(ALL_QUESTIONS.map(q=>q.topic))];
const TOPIC_COLORS = {
  "Cyber Law": "#00d4ff", "IT Act": "#b388ff", "Cybercrime": "#ff3d71",
  "Malware & Threats": "#ff6d00", "Security Measures": "#00e676",
  "Network Security": "#40c4ff", "Data Backup": "#ffd740",
  "Digital Forensics": "#ea80fc", "E-Commerce Security": "#a5d6a7",
  "Cryptography": "#ffab40", "IPR": "#80cbc4"
};

let state = {
  screen: 'setup', // setup | quiz | result
  playerName: 'Anonymous',
  selectedTopic: 'All Topics',
  selectedCount: 25,
  questions: [],
  current: 0,
  answers: [],
  startTime: null,
  elapsed: 0,
  timerInterval: null,
  resultTab: 'leaderboard'
};

let leaderboard = JSON.parse(localStorage.getItem('cq_leaderboard_v2') || '[]');

function shuffle(arr) {
  let a = [...arr];
  for(let i=a.length-1;i>0;i--) { let j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startQuiz() {
  let pool = state.selectedTopic === 'All Topics'
    ? ALL_QUESTIONS
    : ALL_QUESTIONS.filter(q=>q.topic===state.selectedTopic);
  state.questions = shuffle(pool).slice(0, Math.min(state.selectedCount, pool.length));
  state.current = 0;
  state.answers = new Array(state.questions.length).fill(null);
  state.startTime = Date.now();
  state.elapsed = 0;
  state.screen = 'quiz';
  if(state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(()=>{ state.elapsed = Math.floor((Date.now()-state.startTime)/1000); updateHUD(); }, 1000);
  render();
}

function selectAnswer(idx) {
  if(state.answers[state.current] !== null) return;
  state.answers[state.current] = idx;
  render();
}

function goTo(idx) {
  state.current = idx;
  render();
}

function finishQuiz() {
  clearInterval(state.timerInterval);
  let score = state.answers.filter((a,i)=>a===state.questions[i].ans).length;
  let pct = Math.round((score/state.questions.length)*100);
  let entry = {
    name: state.playerName,
    score, total: state.questions.length,
    pct, elapsed: state.elapsed,
    topic: state.selectedTopic,
    date: new Date().toLocaleDateString()
  };
  leaderboard.push(entry);
  leaderboard.sort((a,b)=>b.pct-a.pct||a.elapsed-b.elapsed);
  leaderboard = leaderboard.slice(0,20);
  localStorage.setItem('cq_leaderboard_v2', JSON.stringify(leaderboard));
  state.screen = 'result';
  state.resultTab = 'leaderboard';
  render();
}

function formatTime(s) {
  let m = Math.floor(s/60);
  return `${m}:${String(s%60).padStart(2,'0')}`;
}

function pctColor(p) { return p>=80 ? 'high' : p>=50 ? 'mid' : 'low'; }
function pctBarColor(p) { return p>=80 ? 'var(--green)' : p>=50 ? 'var(--yellow)' : 'var(--red)'; }

function rankMedal(i) {
  if(i===0) return '🥇';
  if(i===1) return '🥈';
  if(i===2) return '🥉';
  return `#${i+1}`;
}

function renderSetup() {
  const topicChips = TOPICS.map(t => `
    <span class="chip ${state.selectedTopic===t?'active':''}"
      onclick="state.selectedTopic='${t}';render()">${t}</span>
  `).join('');

  const counts = [10,25,50,ALL_QUESTIONS.length];
  const countOpts = counts.map(n => `
    <button class="count-opt ${state.selectedCount===n?'active':''}"
      onclick="state.selectedCount=${n};render()">${n=== ALL_QUESTIONS.length?'All ('+n+')':n}</button>
  `).join('');

  let pool = state.selectedTopic==='All Topics' ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q=>q.topic===state.selectedTopic);
  let available = Math.min(state.selectedCount, pool.length);

  return `
    <div class="site-header">
      <div class="logo-icon">🛡️</div>
      <div>
        <div class="site-title">Cyber<span>Quiz</span></div>
        <div class="site-sub">${ALL_QUESTIONS.length} questions · ${TOPICS.length-1} topics</div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Player Setup</div>
      <div class="field-label">Your Name</div>
      <input id="pname" type="text" placeholder="Enter your name..." value="${state.playerName==='Anonymous'?'':state.playerName}"
        oninput="state.playerName=this.value||'Anonymous'" style="margin-bottom:20px"/>

      <div class="field-label">Select Topic</div>
      <div class="topic-chips">${topicChips}</div>
    </div>

    <div class="card">
      <div class="section-title">Quiz Length</div>
      <div class="q-count-options">${countOpts}</div>
      <p style="font-size:12px;color:var(--muted);margin-top:10px">
        ${available} questions will be drawn${state.selectedTopic!=='All Topics'?' from '+state.selectedTopic:''}
      </p>
    </div>

    <button class="btn-start" onclick="startQuiz()">
      Start Quiz →
    </button>

    ${leaderboard.length > 0 ? `
    <div class="card" style="margin-top:16px">
      <div class="lb-header">
        <div class="lb-title">🏆 Leaderboard</div>
        <span style="font-size:12px;color:var(--muted)">${leaderboard.length} entries</span>
      </div>
      ${renderLeaderboardRows(leaderboard, null, 5)}

  `;
}

function renderQuiz() {
  const q = state.questions[state.current];
  const ans = state.answers[state.current];
  const total = state.questions.length;
  const score = state.answers.filter((a,i)=>a!==null&&a===state.questions[i].ans).length;
  const wrong = state.answers.filter((a,i)=>a!==null&&a!==state.questions[i].ans).length;
  const pct = Math.round((state.current/total)*100);
  const allAnswered = state.answers.every(a=>a!==null);

  const dots = state.questions.map((qq, i) => {
    let cls = 'q-dot';
    if(i===state.current) cls += ' current';
    else if(state.answers[i]!==null) {
      cls += state.answers[i]===qq.ans ? ' correct' : ' wrong';
    } else if(i<state.current) cls += ' skipped';
    return `<div class="${cls}" onclick="goTo(${i})">${i+1}</div>`;
  }).join('');

  const opts = q.opts.map((o, i) => {
    let cls = 'opt';
    if(ans !== null) {
      if(i === q.ans) cls += ' highlight-correct';
      if(i === ans && ans !== q.ans) cls += ' wrong';
      if(i === ans && ans === q.ans) cls = 'opt correct';
    }
    return `
      <button class="${cls}" onclick="selectAnswer(${i})" ${ans!==null?'disabled':''}>
        <span class="opt-letter">${String.fromCharCode(65+i)}</span>
        <span class="opt-text">${o}</span>
      </button>`;
  }).join('');

  return `
    <div class="site-header" style="margin-bottom:20px">
      <div class="logo-icon" style="cursor:pointer" onclick="if(confirm('Quit quiz?')){clearInterval(state.timerInterval);state.screen='setup';render()}">🛡️</div>
      <div style="flex:1">
        <div class="site-title">Cyber<span>Quiz</span></div>
      </div>
      <div class="timer ${state.elapsed>=(total*30)*0.9?'danger':state.elapsed>=(total*30)*0.7?'warn':''}" id="quiz-timer">
        ⏱ ${formatTime(state.elapsed)}
      </div>
    </div>

    <div class="hud">
      <div class="hud-box"><div class="hud-val blue">${state.current+1}/${total}</div><div class="hud-lbl">Question</div></div>
      <div class="hud-box"><div class="hud-val green">${score}</div><div class="hud-lbl">Correct</div></div>
      <div class="hud-box"><div class="hud-val red">${wrong}</div><div class="hud-lbl">Wrong</div></div>
      <div class="hud-box"><div class="hud-val" style="font-size:13px;padding-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${state.playerName}</div><div class="hud-lbl">Player</div></div>
    </div>

    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>

    <div class="q-dots">${dots}</div>

    <div class="card">
      <div class="q-meta">
        <span class="q-index">Q${state.current+1} of ${total}</span>
        <span class="topic-badge" style="background:${TOPIC_COLORS[q.topic]+'22'};border-color:${TOPIC_COLORS[q.topic]+'66'};color:${TOPIC_COLORS[q.topic]}">${q.topic}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options">${opts}</div>
      ${ans !== null ? `<div class="explanation show">
        💡 The correct answer is <strong style="color:var(--green)">${String.fromCharCode(65+q.ans)}: ${q.opts[q.ans]}</strong>
        ${ans===q.ans ? ' — Well done! ✓' : ''}
      </div>` : ''}
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" onclick="goTo(${state.current-1})" ${state.current===0?'disabled':''}>← Prev</button>
      <div class="nav-spacer"></div>
      ${state.current < total-1
        ? `<button class="btn btn-primary" onclick="goTo(${state.current+1})">Next →</button>`
        : `<button class="btn btn-primary" onclick="finishQuiz()" ${!allAnswered?'style="background:var(--yellow);color:#000"':''}>
            ${allAnswered ? 'Finish ✓' : 'Finish ('+state.answers.filter(a=>a!==null).length+'/'+total+')'}
           </button>`
      }
    </div>
  `;
}

function renderLeaderboardRows(data, currentEntry, limit) {
  let rows = (limit ? data.slice(0, limit) : data).map((p, i) => {
    let isYou = currentEntry && p === currentEntry;
    let medal = rankMedal(i);
    let isMedal = i < 3;
    return `
      <div class="lb-row ${isYou?'lb-you':''}" style="animation-delay:${i*40}ms">
        <div class="lb-rank ${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':''}">${medal}</div>
        <div class="lb-name">${p.name}${isYou?'<span class="you-badge">YOU</span>':''}</div>
        <div class="lb-score" style="text-align:right">${p.score}/${p.total}</div>
        <div class="lb-bar-wrap">
          <div class="lb-bar-bg"><div class="lb-bar-fill" style="width:${p.pct}%;background:${pctBarColor(p.pct)}"></div></div>
        </div>
        <div class="lb-pct ${pctColor(p.pct)}">${p.pct}%</div>
      </div>`;
  }).join('');
  if(!rows) return '<div class="empty-state">No scores yet. Be the first!</div>';
  return `
    <div class="lb-cols">
      <div class="lb-col-lbl">#</div>
      <div class="lb-col-lbl">Player</div>
      <div class="lb-col-lbl" style="text-align:right">Score</div>
      <div class="lb-col-lbl"></div>
      <div class="lb-col-lbl">%</div>
    </div>
    ${rows}`;
}

function renderResult() {
  const score = state.answers.filter((a,i)=>a===state.questions[i].ans).length;
  const total = state.questions.length;
  const pct = Math.round((score/total)*100);
  const wrong = total - score;
  const skipped = state.answers.filter(a=>a===null).length;
  const elapsed = state.elapsed;

  // find current entry
  const currentEntry = leaderboard.find(e=>e.name===state.playerName&&e.pct===pct&&e.score===score);
  const myRank = leaderboard.indexOf(currentEntry)+1;

  const grade = pct>=90?['Outstanding! 🔥','You aced it — elite cyber knowledge.']:
                pct>=75?['Great Work! ⚡','Strong performance. Keep sharpening.']:
                pct>=50?['Good Effort 📈','Decent result. Review weak areas.']:
                        ['Keep Studying 📚','Focus on your weak topics below.'];

  // ring SVG
  const r = 60, circ = 2*Math.PI*r;
  const dashVal = circ * (pct/100);

  // topic breakdown
  const topicMap = {};
  state.questions.forEach((q,i)=>{
    if(!topicMap[q.topic]) topicMap[q.topic]={correct:0,total:0};
    topicMap[q.topic].total++;
    if(state.answers[i]===q.ans) topicMap[q.topic].correct++;
  });
  const tbRows = Object.entries(topicMap).sort((a,b)=>a[1].correct/a[1].total - b[1].correct/b[1].total).map(([t,v])=>{
    let tp = Math.round((v.correct/v.total)*100);
    return `<div class="tb-row">
      <div class="tb-name">${t}</div>
      <div class="tb-bar-bg"><div class="tb-bar-fill" style="width:${tp}%;background:${pctBarColor(tp)}"></div></div>
      <div class="tb-score ${pctColor(tp)}">${v.correct}/${v.total}</div>
    </div>`;
  }).join('');

  const tabContent = state.resultTab === 'leaderboard'
    ? renderLeaderboardRows(leaderboard, currentEntry, 15)
    : `<div class="topic-breakdown">${tbRows}</div>`;

  return `
    <div class="site-header" style="margin-bottom:20px">
      <div class="logo-icon">🛡️</div>
      <div><div class="site-title">Cyber<span>Quiz</span></div></div>
    </div>

    <div class="card result-hero">
      <div class="grade-text">${grade[0]}</div>
      <div class="grade-sub">${grade[1]}</div>
      <div class="score-ring">
        <svg viewBox="0 0 150 150" width="150" height="150">
          <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--border2)" stroke-width="10"/>
          <circle cx="75" cy="75" r="${r}" fill="none" stroke="${pctBarColor(pct)}" stroke-width="10"
            stroke-dasharray="${dashVal} ${circ}" stroke-linecap="round"
            style="transition:stroke-dasharray 1s ease"/>
        </svg>
        <div class="score-ring-val">
          <div class="score-pct" style="color:${pctBarColor(pct)}">${pct}%</div>
          <div class="score-frac">${score}/${total}</div>
        </div>
      </div>
      <div class="result-stats">
        <div class="rstat"><div class="rstat-val" style="color:var(--green)">${score}</div><div class="rstat-lbl">Correct</div></div>
        <div class="rstat"><div class="rstat-val" style="color:var(--red)">${wrong - skipped}</div><div class="rstat-lbl">Wrong</div></div>
        <div class="rstat"><div class="rstat-val" style="color:var(--yellow)">${skipped}</div><div class="rstat-lbl">Skipped</div></div>
        <div class="rstat"><div class="rstat-val" style="color:var(--accent)">${formatTime(elapsed)}</div><div class="rstat-lbl">Time</div></div>
      </div>
      ${myRank ? `<p style="color:var(--muted);font-size:13px">You ranked <strong style="color:var(--accent)">#${myRank}</strong> on the leaderboard</p>` : ''}
    </div>

    <div class="card">
      <div class="tab-row">
        <button class="tab ${state.resultTab==='leaderboard'?'active':''}" onclick="state.resultTab='leaderboard';render()">🏆 Leaderboard</button>
        <button class="tab ${state.resultTab==='breakdown'?'active':''}" onclick="state.resultTab='breakdown';render()">📊 Topic Breakdown</button>
      </div>
      ${tabContent}
    </div>

    <div style="display:flex;gap:12px;margin-top:4px">
      <button class="btn btn-ghost" onclick="state.screen='setup';render()" style="flex:1">← Back to Setup</button>
      <button class="btn btn-primary" onclick="startQuiz()" style="flex:1">Try Again 🔁</button>
    </div>
  `;
}

function updateHUD() {
  const el = document.getElementById('quiz-timer');
  const total = state.questions.length;
  if(el) {
    el.textContent = `⏱ ${formatTime(state.elapsed)}`;
    el.className = 'timer' + (state.elapsed>=(total*30)*0.9?' danger':state.elapsed>=(total*30)*0.7?' warn':'');
  }
}

function render() {
  const app = document.getElementById('app');
  if(state.screen==='setup') app.innerHTML = renderSetup();
  else if(state.screen==='quiz') app.innerHTML = renderQuiz();
  else app.innerHTML = renderResult();
}

render();
</script>
</body>
</html>
