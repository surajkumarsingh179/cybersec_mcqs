<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cyber Security Quiz</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  padding: 20px;
}

.quiz-wrap {
  max-width: 900px;
  margin: auto;
}

.header {
  margin-bottom: 1.5rem;
}

.header h2 {
  font-size: 28px;
  margin-bottom: 6px;
}

.header p {
  color: #94a3b8;
}

.progress-bar {
  height: 6px;
  background: #1e293b;
  border-radius: 20px;
  margin: 1rem 0;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: #2563eb;
  transition: width 0.3s;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 10px;
  margin-bottom: 1.5rem;
}

.stat {
  background: #1e293b;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
}

.stat-val {
  font-size: 22px;
  font-weight: bold;
}

.stat-lbl {
  font-size: 12px;
  color: #94a3b8;
  margin-top: 4px;
}

.q-card {
  background: #1e293b;
  border-radius: 14px;
  padding: 1.25rem;
  margin-bottom: 1rem;
}

.q-num {
  font-size: 13px;
  color: #94a3b8;
  margin-bottom: 10px;
}

.q-text {
  font-size: 18px;
  margin-bottom: 1rem;
  line-height: 1.5;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.opt-btn {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 12px;
  text-align: left;
  cursor: pointer;
  color: white;
  transition: 0.2s;
}

.opt-btn:hover {
  background: #334155;
}

.opt-btn.correct {
  background: green;
}

.opt-btn.wrong {
  background: crimson;
}

.nav {
  display: flex;
  gap: 10px;
  margin-top: 1rem;
  flex-wrap: wrap;
}

.btn {
  background: #334155;
  border: none;
  border-radius: 10px;
  padding: 10px 18px;
  cursor: pointer;
  color: white;
}

.btn-primary {
  background: #2563eb;
}

.result-screen {
  text-align: center;
}

.score-circle {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  border: 5px solid #2563eb;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  margin: 20px auto;
}

.score-pct {
  font-size: 32px;
  font-weight: bold;
}

.score-sub {
  font-size: 13px;
  color: #94a3b8;
}

.filter-row {
  display: flex;
  gap: 10px;
  margin-bottom: 1rem;
  flex-wrap: wrap;
  align-items: center;
}

input, select {
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #0f172a;
  color: white;
}

.badge {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 20px;
  background: #2563eb;
}

.leaderboard-item {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #334155;
}
</style>
</head>

<body>

<div class="quiz-wrap" id="app"></div>

<script>

const ALL_QUESTIONS = [
  {
    q:"What is phishing?",
    opts:[
      "Online shopping",
      "Fraud attempt to steal information",
      "Firewall setup",
      "Password encryption"
    ],
    ans:1,
    topic:"Cybercrime"
  },
  {
    q:"Which protocol is secure?",
    opts:["HTTP","HTTPS","FTP","SMTP"],
    ans:1,
    topic:"Network Security"
  },
  {
    q:"Firewall is used for?",
    opts:[
      "Gaming",
      "Unauthorized access prevention",
      "Music streaming",
      "Editing videos"
    ],
    ans:1,
    topic:"Security"
  },
  {
    q:"Which malware replicates itself?",
    opts:["Trojan","Worm","Spyware","Adware"],
    ans:1,
    topic:"Malware"
  },
  {
    q:"Strong passwords should contain?",
    opts:[
      "Only numbers",
      "Only letters",
      "Mixed characters",
      "Only symbols"
    ],
    ans:2,
    topic:"Security"
  }
];

const TOPICS = ["All Topics", ...new Set(ALL_QUESTIONS.map(q => q.topic))];

let questions = [];
let current = 0;
let score = 0;
let answered = [];
let started = false;

let playerName = "";

let leaderboard =
  JSON.parse(localStorage.getItem("leaderboard")) || [];

function shuffle(arr) {
  let a = [...arr];

  for (let i = a.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }

  return a;
}

function startQuiz(topic, num) {

  let pool =
    topic === "All Topics"
      ? ALL_QUESTIONS
      : ALL_QUESTIONS.filter(q => q.topic === topic);

  questions =
    shuffle(pool).slice(0, Math.min(num, pool.length));

  current = 0;
  score = 0;

  answered = new Array(questions.length).fill(null);

  started = true;

  render();
}

function selectAnswer(idx) {

  if (answered[current] !== null) return;

  answered[current] = idx;

  if (idx === questions[current].ans) score++;

  render();
}

function next() {

  if (current < questions.length - 1) {
    current++;
    render();
  }
}

function prev() {

  if (current > 0) {
    current--;
    render();
  }
}

function renderStart() {

  return `
    <div class="header">
      <h2>Cyber Security Quiz 🛡️</h2>
      <p>${ALL_QUESTIONS.length} Questions Available</p>
    </div>

    <div class="q-card">

      <div class="filter-row">
        <label>Name</label>

        <input
          type="text"
          id="playerName"
          placeholder="Enter your name"
        />
      </div>

      <div class="filter-row">
        <label>Topic</label>

        <select id="topicSel">
          ${TOPICS.map(
            t => `<option>${t}</option>`
          ).join("")}
        </select>
      </div>

      <div class="filter-row">
        <label>Questions</label>

        <select id="numSel">
          <option value="5">5</option>
        </select>
      </div>

      <button
        class="btn btn-primary"
        onclick="
          const t = document.getElementById('topicSel').value;

          const n =
            parseInt(document.getElementById('numSel').value);

          playerName =
            document.getElementById('playerName').value
            || 'Anonymous';

          startQuiz(t,n);
        "
      >
        Start Quiz 🚀
      </button>

    </div>

    <div class="q-card">

      <h3 style="margin-bottom:15px;">
        🏆 Leaderboard
      </h3>

      ${
        leaderboard.length === 0
          ? `<p>No scores yet</p>`
          : leaderboard.map((p,i)=>`
            <div class="leaderboard-item">
              <span>#${i+1} ${p.name}</span>
              <strong>${p.percentage}%</strong>
            </div>
          `).join("")
      }

    </div>
  `;
}

function renderQuiz() {

  const q = questions[current];

  const ans = answered[current];

  const total = questions.length;

  const pct =
    Math.round((current / total) * 100);

  return `

    <div class="stats">

      <div class="stat">
        <div class="stat-val">
          ${current + 1}/${total}
        </div>

        <div class="stat-lbl">
          Question
        </div>
      </div>

      <div class="stat">
        <div class="stat-val" style="color:lightgreen;">
          ${score}
        </div>

        <div class="stat-lbl">
          Correct
        </div>
      </div>

      <div class="stat">
        <div class="stat-val" style="color:#ff6b6b;">
          ${
            answered.filter(
              (a,i)=>
                a!==null &&
                a!==questions[i].ans
            ).length
          }
        </div>

        <div class="stat-lbl">
          Wrong
        </div>
      </div>

      <div class="stat">
        <div class="stat-val">
          ${playerName}
        </div>

        <div class="stat-lbl">
          Player
        </div>
      </div>

    </div>

    <div class="progress-bar">
      <div
        class="progress-fill"
        style="width:${pct}%"
      ></div>
    </div>

    <div class="q-card">

      <div class="q-num">
        Q${current + 1}
        ·
        <span class="badge">${q.topic}</span>
      </div>

      <div class="q-text">
        ${q.q}
      </div>

      <div class="options">

        ${
          q.opts.map((o,i)=>{

            let cls = "opt-btn";

            if(ans !== null){

              if(i === q.ans)
                cls += " correct";

              else if(i === ans)
                cls += " wrong";
            }

            return `
              <button
                class="${cls}"
                onclick="selectAnswer(${i})"
                ${ans !== null ? "disabled" : ""}
              >
                ${String.fromCharCode(65+i)}.
                ${o}
              </button>
            `;

          }).join("")
        }

      </div>

    </div>

    <div class="nav">

      <button
        class="btn"
        onclick="prev()"
        ${current===0 ? "disabled" : ""}
      >
        ← Previous
      </button>

      ${
        current < total - 1
          ? `
            <button
              class="btn btn-primary"
              onclick="next()"
            >
              Next →
            </button>
          `
          : `
            <button
              class="btn btn-primary"
              onclick="showResult()"
            >
              Finish Test 🎯
            </button>
          `
      }

    </div>
  `;
}

function showResult() {

  const total = questions.length;

  const pct =
    Math.round((score / total) * 100);

  leaderboard.push({
    name: playerName,
    score: score,
    total: total,
    percentage: pct
  });

  leaderboard.sort(
    (a,b)=>b.percentage-a.percentage
  );

  leaderboard = leaderboard.slice(0,10);

  localStorage.setItem(
    "leaderboard",
    JSON.stringify(leaderboard)
  );

  const grade =
    pct >= 90
      ? "Excellent 🔥"
      : pct >= 70
      ? "Good Job ⚡"
      : "Keep Practicing 📚";

  document.getElementById("app").innerHTML = `

    <div class="result-screen">

      <h2>${grade}</h2>

      <div class="score-circle">
        <span class="score-pct">
          ${pct}%
        </span>

        <span class="score-sub">
          ${score}/${total}
        </span>
      </div>

      <div class="q-card">

        <h3 style="margin-bottom:15px;">
          🏆 Leaderboard
        </h3>

        ${
          leaderboard.map((p,i)=>`
            <div class="leaderboard-item">
              <span>#${i+1} ${p.name}</span>

              <strong>
                ${p.percentage}%
                (${p.score}/${p.total})
              </strong>
            </div>
          `).join("")
        }

      </div>

      <button
        class="btn btn-primary"
        onclick="
          started=false;
          render();
        "
      >
        New Test 🚀
      </button>

    </div>
  `;
}

function render() {

  document.getElementById("app").innerHTML =
    started
      ? renderQuiz()
      : renderStart();
}

render();

</script>

</body>
</html>
