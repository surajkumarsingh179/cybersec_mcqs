# Full Updated Quiz App Code With Leaderboard 🏆

Save this as:

```text
index.html
```

```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cyber Security Quiz</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: white;
  padding: 20px;
}

.container {
  max-width: 900px;
  margin: auto;
}

.header {
  text-align: center;
  margin-bottom: 30px;
}

.header h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

.card {
  background: #121c2e;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 20px;
}

input, select {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  margin-top: 8px;
  margin-bottom: 18px;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #2563eb;
  color: white;
  font-size: 16px;
}

button:hover {
  background: #1d4ed8;
}

.option {
  display: block;
  width: 100%;
  text-align: left;
  margin-bottom: 10px;
  background: #1e293b;
}

.option.correct {
  background: green;
}

.option.wrong {
  background: crimson;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.stat {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}

.leaderboard-item {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #334155;
}

.progress {
  width: 100%;
  height: 10px;
  background: #1e293b;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 20px;
}

.progress-bar {
  height: 100%;
  background: #2563eb;
}
</style>
</head>
<body>

<div class="container">
  <div id="app"></div>
</div>

<script>
const ALL_QUESTIONS = [
  {
    q: "What is phishing?",
    opts: [
      "Fishing online",
      "Fraudulent attempt to steal information",
      "Virus removal",
      "Firewall setup"
    ],
    ans: 1
  },
  {
    q: "Which is used for secure communication?",
    opts: ["HTTP", "FTP", "HTTPS", "SMTP"],
    ans: 2
  },
  {
    q: "Which malware replicates itself?",
    opts: ["Trojan", "Worm", "Spyware", "Adware"],
    ans: 1
  },
  {
    q: "Firewall is used for?",
    opts: [
      "Cooking",
      "Unauthorized access prevention",
      "Gaming",
      "Music"
    ],
    ans: 1
  },
  {
    q: "Strong passwords should contain?",
    opts: [
      "Only numbers",
      "Only letters",
      "Mixed characters",
      "Only symbols"
    ],
    ans: 2
  }
];

let current = 0;
let score = 0;
let started = false;
let answered = [];
let playerName = "";

let leaderboard = JSON.parse(localStorage.getItem("leaderboard")) || [];

function renderStart() {
  return `
    <div class="header">
      <h1>Cyber Security Quiz 🛡️</h1>
      <p>Test your cybersecurity knowledge</p>
    </div>

    <div class="card">
      <label>Your Name</label>
      <input type="text" id="playerName" placeholder="Enter your name" />

      <button onclick="startQuiz()">Start Quiz 🚀</button>
    </div>

    <div class="card">
      <h2 style="margin-bottom:15px;">🏆 Leaderboard</h2>

      ${leaderboard.length === 0
        ? `<p>No scores yet</p>`
        : leaderboard.map((p, i) => `
          <div class="leaderboard-item">
            <span>#${i + 1} ${p.name}</span>
            <strong>${p.percentage}%</strong>
          </div>
        `).join("")
      }
    </div>
  `;
}

function startQuiz() {
  playerName = document.getElementById("playerName").value || "Anonymous";
  started = true;
  current = 0;
  score = 0;
  answered = new Array(ALL_QUESTIONS.length).fill(null);
  render();
}

function selectAnswer(index) {
  if (answered[current] !== null) return;

  answered[current] = index;

  if (index === ALL_QUESTIONS[current].ans) {
    score++;
  }

  render();
}

function nextQuestion() {
  if (current < ALL_QUESTIONS.length - 1) {
    current++;
    render();
  } else {
    showResult();
  }
}

function showResult() {
  const total = ALL_QUESTIONS.length;
  const percentage = Math.round((score / total) * 100);

  leaderboard.push({
    name: playerName,
    score,
    total,
    percentage
  });

  leaderboard.sort((a, b) => b.percentage - a.percentage);

  leaderboard = leaderboard.slice(0, 10);

  localStorage.setItem("leaderboard", JSON.stringify(leaderboard));

  document.getElementById("app").innerHTML = `
    <div class="header">
      <h1>Quiz Completed 🎉</h1>
      <p>${playerName}, your score is:</p>
    </div>

    <div class="card" style="text-align:center;">
      <h2 style="font-size:50px;">${percentage}%</h2>
      <p>${score}/${total} Correct</p>
    </div>

    <div class="card">
      <h2 style="margin-bottom:15px;">🏆 Leaderboard</h2>

      ${leaderboard.map((p, i) => `
        <div class="leaderboard-item">
          <span>#${i + 1} ${p.name}</span>
          <strong>${p.percentage}% (${p.score}/${p.total})</strong>
        </div>
      `).join("")}
    </div>

    <button onclick="restartQuiz()">Play Again 🔄</button>
  `;
}

function restartQuiz() {
  started = false;
  render();
}

function renderQuiz() {
  const q = ALL_QUESTIONS[current];
  const ans = answered[current];

  return `
    <div class="stats">
      <div class="stat">
        <h3>${current + 1}/${ALL_QUESTIONS.length}</h3>
        <p>Question</p>
      </div>

      <div class="stat">
        <h3>${score}</h3>
        <p>Correct</p>
      </div>

      <div class="stat">
        <h3>${ALL_QUESTIONS.length - score}</h3>
        <p>Remaining</p>
      </div>

      <div class="stat">
        <h3>${playerName}</h3>
        <p>Player</p>
      </div>
    </div>

    <div class="progress">
      <div class="progress-bar" style="width:${((current + 1) / ALL_QUESTIONS.length) * 100}%"></div>
    </div>

    <div class="card">
      <h2 style="margin-bottom:20px;">${q.q}</h2>

      ${q.opts.map((opt, i) => {
        let cls = "option";

        if (ans !== null) {
          if (i === q.ans) cls += " correct";
          else if (i === ans) cls += " wrong";
        }

        return `
          <button class="${cls}" onclick="selectAnswer(${i})">
            ${opt}
          </button>
        `;
      }).join("")}

      ${ans !== null
        ? `<button style="margin-top:15px;" onclick="nextQuestion()">Next ➜</button>`
        : ""
      }
    </div>
  `;
}

function render() {
  document.getElementById("app").innerHTML = started
    ? renderQuiz()
    : renderStart();
}

render();
</script>

</body>
</html>
```
